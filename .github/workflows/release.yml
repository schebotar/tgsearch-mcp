# Публикация релиза: тег vX.Y.Z → пакет на PyPI + страница релиза на GitHub.
#
# Триггер только по тегу: версию на PyPI не перезаписать, поэтому «на каждый
# мерж» не годится. Перед публикацией гоняются те же проверки, что в ci.yml,
# плюс две страховки: тег обязан стоять на main и совпадать с __version__ —
# публикация необратима, дешевле остановиться до неё.
#
# Аутентификация — PyPI Trusted Publishing (OIDC), долгоживущего токена в
# secrets нет. В отличие от npm, доверенного издателя на PyPI можно завести
# ДО первой публикации: Settings → Publishing → Add a pending publisher с
# параметрами: проект tgsearch-mcp, owner schebotar, repo tgsearch-mcp,
# workflow release.yml, environment pypi. После этого дебютный тег публикуется
# тем же конвейером, ручная первая загрузка не нужна.
#
# Шаг публикации пропускается, если версия уже есть в реестре: перезапуск
# упавшего релиза не должен падать на «File already exists».
#
# Запасной путь, если trusted publishing недоступен: API-токен PyPI в секрете
# PYPI_TOKEN и `password: ${{ secrets.PYPI_TOKEN }}` в шаге публикации — с
# заметкой о ротации токена.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: write # создание GitHub Release
      id-token: write # OIDC для Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # нужна история: проверяем, что тег на main

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Тег стоит на main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Тег $GITHUB_REF_NAME не на main — релиз собирается только оттуда"
            exit 1
          fi

      - name: Версия тега совпадает с __version__
        id: version
        run: |
          python - <<'PY' > version.txt
          import pathlib
          import re

          text = pathlib.Path("src/tgsearch_mcp/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("__version__ не найден в src/tgsearch_mcp/__init__.py")
          print(match.group(1))
          PY
          version="$(cat version.txt)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а __version__ = $version — публикация остановлена"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Версия: $GITHUB_REF_NAME"

      - name: Зависимости
        run: python -m pip install -e ".[dev]"

      - name: Тесты
        run: pytest -q

      - name: Старт сервера по stdio без кредов
        run: python scripts/smoke.py

      - name: Сборка и проверка пакета
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Версия уже на PyPI?
        id: registry
        run: |
          if curl -fsS "https://pypi.org/pypi/tgsearch-mcp/${{ steps.version.outputs.version }}/json" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tgsearch-mcp ${{ steps.version.outputs.version }} уже на PyPI — публикация пропускается"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Публикация на PyPI
        if: steps.registry.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Релиз $GITHUB_REF_NAME уже создан — шаг пропущен"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
